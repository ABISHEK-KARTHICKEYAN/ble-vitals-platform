<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vitals Telemetry System</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #0d0d0d;
      --border: #333333;
      --border-bright: #ffffff;
      --text: #ffffff;
      --text-muted: #888888;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Courier New", Courier, monospace;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-bright);
      padding-bottom: 1rem;
    }
    .btn {
      background: #000000;
      color: #ffffff;
      border: 1px solid var(--border-bright);
      padding: 0.5rem 1rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn:hover {
      background: #ffffff;
      color: #000000;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 1.25rem;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .metric-box {
      border: 1px solid var(--border);
      padding: 1rem;
    }
    .metric-label {
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
    }
    .metric-value {
      font-size: 2rem;
      font-weight: bold;
      margin-top: 0.25rem;
    }
    /* Waveform Canvas Wrapper */
    .waveform-wrapper {
      position: relative;
      width: 100%;
      height: 220px;
      background: #050505;
      border: 1px solid var(--border);
      margin-top: 1rem;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    input {
      width: 100%;
      background: #000000;
      border: 1px solid var(--border);
      color: #ffffff;
      padding: 0.6rem;
      margin-bottom: 0.75rem;
      font-family: inherit;
    }
    input:focus {
      outline: none;
      border-color: var(--border-bright);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      font-size: 0.8rem;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 0.5rem;
      text-align: left;
    }
    th {
      background: #111111;
      color: var(--text-muted);
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h2 style="letter-spacing: 1px;">PPG VITALS GATEWAY</h2>
      <div id="authStatus" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">UNAUTHORIZED</div>
    </div>
    <button id="authBtn" class="btn" onclick="toggleAuthModal()">LOGIN / REGISTER</button>
  </header>

  <!-- Monochrome Auth Form -->
  <div id="authCard" class="card" style="display: none;">
    <h4 id="authFormTitle" style="margin-bottom: 1rem;">AUTHENTICATE SESSION</h4>
    <input type="text" id="authUsername" placeholder="USERNAME" />
    <input type="email" id="authEmail" placeholder="EMAIL (REGISTER ONLY)" style="display: none;" />
    <input type="password" id="authPassword" placeholder="PASSWORD" />
    <div style="display: flex; gap: 0.5rem;">
      <button class="btn" id="submitAuthBtn" onclick="handleAuthSubmit()">SUBMIT</button>
      <button class="btn" onclick="toggleAuthMode()">SWITCH MODE</button>
    </div>
  </div>

  <!-- Hardware Stream & Live Waveform -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <button class="btn" onclick="connectBLE()">PAIR BLE DEVICE</button>
      <span id="bleStatus" style="color: var(--text-muted); font-size: 0.8rem;">DISCONNECTED</span>
    </div>

    <!-- Telemetry Readouts -->
    <div class="grid-3">
      <div class="metric-box">
        <div class="metric-label">Heart Rate</div>
        <div class="metric-value" id="bpmVal">-- <span style="font-size: 0.9rem;">BPM</span></div>
      </div>
      <div class="metric-box">
        <div class="metric-label">Signal Peak AC</div>
        <div class="metric-value" id="acVal">--</div>
      </div>
      <div class="metric-box">
        <div class="metric-label">Classification</div>
        <div class="metric-value" id="statusVal" style="font-size: 1.25rem;">--</div>
      </div>
    </div>

    <!-- Auto-Scaling Oscilloscope Canvas -->
    <div class="waveform-wrapper">
      <canvas id="scopeCanvas"></canvas>
    </div>
  </div>

  <!-- Telemetry Database Logs -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span style="font-weight: bold; text-transform: uppercase;">Cloud Database Logs</span>
      <button class="btn" onclick="fetchLogs()">FETCH LOGS</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Timestamp (UTC)</th>
          <th>BPM</th>
          <th>Peak AC</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="logsTableBody">
        <tr><td colspan="4" style="text-align: center; color: var(--text-muted);">No records loaded</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  const BACKEND_URL = "http://127.0.0.1:8000"; // Swap to your Render HTTPS URL when deploying
  const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
  const CHAR_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

  let token = localStorage.getItem("access_token") || null;
  let currentUser = localStorage.getItem("username") || null;
  let isRegisterMode = false;
  let lastLogTime = 0;

  // --- Waveform Rendering Engine ---
  const canvas = document.getElementById("scopeCanvas");
  const ctx = canvas.getContext("2d");
  const maxPoints = 250;
  let waveBuffer = new Array(maxPoints).fill(0);

  function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  function drawWaveform() {
    ctx.fillStyle = "#050505";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // High-contrast grid lines
    ctx.strokeStyle = "#1a1a1a";
    ctx.lineWidth = 1;
    const gridSpacing = 30;
    for (let x = 0; x < canvas.width; x += gridSpacing) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, canvas.height);
      ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += gridSpacing) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(canvas.width, y);
      ctx.stroke();
    }

    // Auto-scale min/max dynamically so waveform is always in full view
    let min = Math.min(...waveBuffer);
    let max = Math.max(...waveBuffer);
    let range = max - min;
    if (range < 5) range = 5; // prevent flat-line division by zero

    // Stark white trace
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.beginPath();

    const step = canvas.width / (maxPoints - 1);
    const padding = 20; // prevent clipping at top/bottom edges
    const usableHeight = canvas.height - padding * 2;

    for (let i = 0; i < maxPoints; i++) {
      const normalized = (waveBuffer[i] - min) / range;
      const y = canvas.height - padding - (normalized * usableHeight);
      const x = i * step;

      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    requestAnimationFrame(drawWaveform);
  }
  requestAnimationFrame(drawWaveform);

  // --- Authentication Handlers ---
  updateAuthUI();

  function toggleAuthModal() {
    const card = document.getElementById("authCard");
    card.style.display = card.style.display === "none" ? "block" : "none";
  }

  function toggleAuthMode() {
    isRegisterMode = !isRegisterMode;
    document.getElementById("authFormTitle").innerText = isRegisterMode ? "REGISTER ACCOUNT" : "AUTHENTICATE SESSION";
    document.getElementById("authEmail").style.display = isRegisterMode ? "block" : "none";
  }

  async function handleAuthSubmit() {
    const u = document.getElementById("authUsername").value.trim();
    const p = document.getElementById("authPassword").value.trim();
    const e = document.getElementById("authEmail").value.trim();

    if (!u || !p) return alert("Enter username and password.");

    if (isRegisterMode) {
      const res = await fetch(`${BACKEND_URL}/api/auth/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: u, email: e, password: p })
      });
      if (res.ok) {
        alert("Registration complete. Please sign in.");
        toggleAuthMode();
      } else {
        const err = await res.json();
        alert(err.detail || "Registration failed");
      }
    } else {
      const form = new URLSearchParams();
      form.append("username", u);
      form.append("password", p);

      const res = await fetch(`${BACKEND_URL}/api/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: form
      });
      if (res.ok) {
        const data = await res.json();
        token = data.access_token;
        currentUser = data.username;
        localStorage.setItem("access_token", token);
        localStorage.setItem("username", currentUser);
        toggleAuthModal();
        updateAuthUI();
        fetchLogs();
      } else {
        alert("Invalid credentials.");
      }
    }
  }

  function logout() {
    token = null;
    currentUser = null;
    localStorage.removeItem("access_token");
    localStorage.removeItem("username");
    updateAuthUI();
  }

  function updateAuthUI() {
    const status = document.getElementById("authStatus");
    const btn = document.getElementById("authBtn");
    if (token && currentUser) {
      status.innerText = `SESSION: ACTIVE [${currentUser.toUpperCase()}]`;
      btn.innerText = "LOGOUT";
      btn.onclick = logout;
      fetchLogs();
    } else {
      status.innerText = "STATUS: UNAUTHORIZED";
      btn.innerText = "LOGIN / REGISTER";
      btn.onclick = toggleAuthModal;
    }
  }

  // --- BLE Ingest ---
  async function connectBLE() {
    if (!token) {
      alert("Authenticate before pairing sensor.");
      toggleAuthModal();
      return;
    }
    try {
      const device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: "ESP32" }],
        optionalServices: [SERVICE_UUID]
      });
      document.getElementById("bleStatus").innerText = "CONNECTING...";
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      const char = await service.getCharacteristic(CHAR_UUID);

      await char.startNotifications();
      char.addEventListener("characteristicvaluechanged", handleBLEData);
      document.getElementById("bleStatus").innerText = "STREAMING: " + device.name.toUpperCase();
    } catch (err) {
      document.getElementById("bleStatus").innerText = "ERROR: " + err.message.toUpperCase();
    }
  }

  function handleBLEData(event) {
    const raw = new TextDecoder().decode(event.target.value);
    try {
      const data = JSON.parse(raw);
      document.getElementById("bpmVal").innerHTML = `${data.bpm} <span style="font-size: 0.9rem;">BPM</span>`;
      document.getElementById("acVal").innerText = data.peak_ac;
      document.getElementById("statusVal").innerText = data.status.toUpperCase();

      // Push incoming AC / raw signal point to oscilloscope buffer
      waveBuffer.push(data.peak_ac);
      waveBuffer.shift();

      const now = Date.now();
      if (now - lastLogTime > 3000) {
        lastLogTime = now;
        sendLog(data);
      }
    } catch (e) {
      console.warn("Unparsed packet:", raw);
    }
  }

  async function sendLog(data) {
    if (!token) return;
    try {
      await fetch(`${BACKEND_URL}/api/log`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({
          bpm: data.bpm,
          peak_ac: data.peak_ac,
          status: data.status
        })
      });
    } catch (err) {
      console.error(err);
    }
  }

  async function fetchLogs() {
    if (!token) return;
    try {
      const res = await fetch(`${BACKEND_URL}/api/logs?limit=10`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      if (res.ok) {
        const logs = await res.json();
        const tbody = document.getElementById("logsTableBody");
        tbody.innerHTML = "";
        if (logs.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">NO LOGS FOUND</td></tr>`;
          return;
        }
        logs.forEach(row => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${row.timestamp}</td>
            <td>${row.bpm}</td>
            <td>${row.peak_ac}</td>
            <td>${row.status}</td>
          `;
          tbody.appendChild(tr);
        });
      }
    } catch (err) {
      console.error(err);
    }
  }
</script>
</body>
</html>
