<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IoT Cloud Vitals Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0f19; color: #f1f5f9; margin: 0; padding: 24px; }
    .container { max-width: 900px; margin: 0 auto; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 16px; margin-bottom: 20px; }
    .btn { background: #2563eb; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: #1d4ed8; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
    .card { background: #131d31; border: 1px solid #1e293b; border-radius: 10px; padding: 20px; text-align: center; }
    .metric { font-size: 36px; font-weight: 700; color: #38bdf8; margin-top: 8px; }
    .panel { background: #131d31; border: 1px solid #1e293b; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #1e293b; }
    th { color: #94a3b8; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-ok { background: #064e3b; color: #34d399; }
    .badge-warn { background: #7f1d1d; color: #f87171; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <h2>IoT Cloud Vitals Dashboard</h2>
      <button id="connectBle" class="btn">Pair Bluetooth Sensor</button>
    </div>

    <div class="grid">
      <div class="card">
        <div>Sensor Connection</div>
        <div id="bleStatus" class="metric" style="font-size: 20px; color: #94a3b8;">Disconnected</div>
      </div>
      <div class="card">
        <div>Live Pulse Rate</div>
        <div id="liveBpm" class="metric">-- <span style="font-size: 18px;">BPM</span></div>
      </div>
      <div class="card">
        <div>Cloud Sync</div>
        <div id="syncStatus" class="metric" style="font-size: 20px; color: #34d399;">Active</div>
      </div>
    </div>

    <div class="panel">
      <h3>Photoplethysmogram (PPG) Waveform</h3>
      <canvas id="ppgChart" height="90"></canvas>
    </div>

    <div class="panel">
      <h3>Recent Server Telemetry Logs (Cloud Persisted)</h3>
      <table>
        <thead>
          <tr>
            <th>Timestamp (UTC)</th>
            <th>Heart Rate</th>
            <th>Pulse Amplitude</th>
            <th>Diagnosis Status</th>
          </tr>
        </thead>
        <tbody id="logTableBody">
          <tr><td colspan="4">No logs recorded yet. Connect sensor to begin logging.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const BACKEND_URL = "https://vitals-backend-api.onrender.com";

    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let latestBPM = 0;
    let latestAmplitude = 0;
    let fingerDetected = false;

    const ctx = document.getElementById('ppgChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: { labels: Array(60).fill(''), datasets: [{ data: Array(60).fill(0), borderColor: '#38bdf8', borderWidth: 2, pointRadius: 0, tension: 0.3 }] },
      options: { animation: false, scales: { y: { min: -120, max: 120, grid: { color: '#1e293b' } }, x: { display: false } }, plugins: { legend: { display: false } } }
    });

    document.getElementById('connectBle').addEventListener('click', async () => {
      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'ESP32_PPG_Monitor' }],
          optionalServices: [SERVICE_UUID]
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        const char = await service.getCharacteristic(CHARACTERISTIC_UUID);
        await char.startNotifications();

        document.getElementById('bleStatus').innerText = "Streaming";
        document.getElementById('bleStatus').style.color = "#34d399";

        char.addEventListener('characteristicvaluechanged', (e) => {
          const raw = new TextDecoder().decode(e.target.value);
          const data = JSON.parse(raw);
          latestBPM = data.bpm;
          latestAmplitude = data.v;
          fingerDetected = data.f === 1;

          document.getElementById('liveBpm').innerHTML = fingerDetected && latestBPM > 0 
            ? `${latestBPM} <span style="font-size: 18px;">BPM</span>` 
            : `-- <span style="font-size: 18px;">BPM</span>`;

          chart.data.datasets[0].data.push(data.v);
          chart.data.datasets[0].data.shift();
          chart.update();
        });
      } catch (err) {
        console.error(err);
      }
    });

    setInterval(async () => {
      if (!fingerDetected || latestBPM === 0) return;
      try {
        await fetch(`${BACKEND_URL}/api/log`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            bpm: latestBPM,
            peak_ac: latestAmplitude,
            status: latestBPM >= 60 && latestBPM <= 100 ? "Normal Sinus" : "Borderline / Elevated"
          })
        });
      } catch (e) {
        console.warn("Backend sync failure:", e);
      }
    }, 3000);

    async function refreshLogs() {
      try {
        const res = await fetch(`${BACKEND_URL}/api/logs?limit=8`);
        const rows = await res.json();
        if (rows.length === 0) return;
        const tbody = document.getElementById('logTableBody');
        tbody.innerHTML = rows.map(r => `
          <tr>
            <td>${r.timestamp}</td>
            <td><strong>${r.bpm}</strong> BPM</td>
            <td>${r.peak_ac}</td>
            <td><span class="badge ${r.status === 'Normal Sinus' ? 'badge-ok' : 'badge-warn'}">${r.status}</span></td>
          </tr>
        `).join('');
      } catch (e) {
        console.error("Fetch logs error:", e);
      }
    }

    setInterval(refreshLogs, 3000);
    refreshLogs();
  </script>
</body>
</html>
